name: Bootstrap v0.5.10 source

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download prepared public source
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            'https://filebin.net/reolink-sip-gateway-v0510-f11a20260816/source.tgz' \
            --output /tmp/reolink-sip-gateway-v0.5.10.tgz
          mkdir -p /tmp/reolink-source
          tar -xzf /tmp/reolink-sip-gateway-v0.5.10.tgz -C /tmp/reolink-source
          test -f /tmp/reolink-source/reolink-sip-gateway/repository.yaml
          test -f /tmp/reolink-source/reolink-sip-gateway/reolink_sip_gateway/config.yaml
          test -f /tmp/reolink-source/reolink-sip-gateway/reolink_sip_gateway/go.mod

      - name: Replace bootstrap tree with release source
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' \
            /tmp/reolink-source/reolink-sip-gateway/ ./
          git status --short

      - name: Publish v0.5.10 source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: publish Reolink SIP Gateway v0.5.10'
          git push origin HEAD:main

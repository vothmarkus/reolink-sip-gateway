name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reolink_sip_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: reolink_sip_gateway/go.mod
      - name: Format check
        run: |
          unformatted="$(gofmt -l cmd internal mobilebridge)"
          if [ -n "${unformatted}" ]; then
            printf 'Files requiring gofmt:\n%s\n' "${unformatted}"
            gofmt -d ${unformatted}
            exit 1
          fi
      - name: Unit tests
        run: go test ./...
      - name: Shuffle tests
        run: go test -shuffle=on ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        # Serialize packages so the calibration pacing test measures its fake
        # real-time source instead of contention from concurrent race builds.
        run: go test -race -p 1 ./...
      - name: Static amd64 build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/reolink-sip-gateway ./cmd/gateway
      - name: Static ARM64 build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/reolink-sip-gateway-arm64 ./cmd/gateway
      - name: Configuration adapter regression
        run: bash ../scripts/test-config-adapter.sh
      - name: Runtime configuration validation
        run: go run ./cmd/gateway -mode homeassistant -check-config -config testdata/options.runtime.valid.json
      - name: Integration API contract syntax
        run: >-
          ruby -e 'require "yaml";
          spec = YAML.load_file("../docs/api-v1.openapi.yaml");
          abort "unexpected OpenAPI version" unless spec["openapi"] == "3.1.0";
          abort "missing API paths" unless spec.fetch("paths").keys.sort == ["/calls/hangup", "/calls/test", "/events", "/info", "/routes/{route_id}/test", "/status"];
          schemas = spec.fetch("components").fetch("schemas");
          abort "missing DTMF event schema" unless schemas.key?("DTMFEvent");
          capabilities = schemas.fetch("Info").fetch("properties").fetch("capabilities").fetch("items").fetch("enum");
          abort "missing DTMF capability" unless capabilities.include?("dtmf_events");
          abort "missing parallel-call capability" unless capabilities.include?("parallel_calls");
          abort "missing route-test capability" unless capabilities.include?("route_test_calls");
          abort "missing route status schema" unless schemas.key?("RouteStatus");
          sip_required = schemas.fetch("SIPStatus").fetch("required");
          abort "missing optional door-account status" unless sip_required.include?("door_call_enabled") && sip_required.include?("door_registered")'

  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            ha_arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            ha_arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build standalone image
        run: >-
          docker buildx build --load --platform linux/${{ matrix.arch }}
          --target standalone -t reolink-sip-gateway:standalone
          reolink_sip_gateway
      - name: Exercise native WebRTC AEC
        run: >-
          python3 scripts/smoke-aec.py docker run --rm -i
          --entrypoint /usr/bin/reolink-aec-helper reolink-sip-gateway:standalone
      - name: Check standalone executable
        run: docker run --rm reolink-sip-gateway:standalone -version
      - name: Build Home Assistant image
        run: >-
          docker buildx build --load --platform linux/${{ matrix.arch }}
          --target homeassistant --build-arg BUILD_VERSION=2.0.0-beta.1
          --build-arg BUILD_ARCH=${{ matrix.ha_arch }}
          -t reolink-sip-gateway:ha reolink_sip_gateway
      - name: Build native Debian package
        run: >-
          docker buildx build --platform linux/${{ matrix.arch }}
          --target native-export --build-arg BUILD_VERSION=2.0.0-beta.1
          --output type=local,dest=dist reolink_sip_gateway
      - name: Check package metadata and architecture
        run: |
          test "$(dpkg-deb -f dist/reolink-sip-gateway.deb Architecture)" = "${{ matrix.arch }}"
          dpkg-deb -I dist/reolink-sip-gateway.deb
          dpkg-deb -x dist/reolink-sip-gateway.deb /tmp/gateway-package
          /tmp/gateway-package/usr/bin/reolink-sip-gateway -version
      - uses: actions/upload-artifact@v4
        with:
          name: reolink-sip-gateway-linux-${{ matrix.arch }}
          path: dist/reolink-sip-gateway.deb
          retention-days: 14


  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: reolink_sip_gateway/go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Build Go Android AAR
        run: bash android/build-core.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preserve debug signing identity for Android branch updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1-${{ github.ref_name }}
      - name: Test, lint and build Android debug APK
        run: gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: android/app/build/reports
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: reolink-sip-gateway-android-alpha
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/libs/reolink-core.aar
          retention-days: 14

openapi: 3.1.0
info:
  title: Reolink SIP Gateway Integration API
  version: 2.0.0-beta.1
  description: >-
    Local API exposed by Reolink SIP Gateway 1.0.0 and newer. The API is
    versioned independently from the gateway release and is intended for the
    companion Home Assistant integration.
servers:
  - url: http://1c33278a-reolink-sip-gateway:18099/api/v1
    description: Internal Home Assistant app hostname
security:
  - bearerAuth: []
paths:
  /info:
    get:
      operationId: getInfo
      summary: Read API identity and capabilities
      responses:
        "200":
          description: Gateway identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /status:
    get:
      operationId: getStatus
      summary: Read the latest complete gateway snapshot
      responses:
        "200":
          description: Complete status snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /events:
    get:
      operationId: streamEvents
      summary: Stream status snapshots and transient DTMF as Server-Sent Events
      description: >-
        Status events use event type `status`, the snapshot revision as their
        ID and a complete Status object as their single-line JSON data value.
        The first event always contains the current snapshot. A completed RFC
        4733 keypress uses event type `dtmf` and a DTMFEvent data object. DTMF
        events deliberately have no SSE ID, do not change the status revision
        and are not replayed after reconnect. Comment keepalives may be sent
        between events.
      responses:
        "200":
          description: Server-Sent Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /calls/test:
    post:
      operationId: startTestCall
      summary: Start an outgoing call for the first configured route (legacy compatibility)
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another call owns the single call slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: SIP is not registered or commands are not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /routes/{route_id}/test:
    post:
      operationId: startRouteTestCall
      summary: Start an outgoing call for one configured route
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{0,63}$'
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The route ID is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Another call owns the single call slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: No SIP account used by this route is registered, or commands are not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /calls/hangup:
    post:
      operationId: hangup
      summary: End the active incoming or outgoing call
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "204":
          description: No call was active; the idempotent request is complete
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Commands are not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: 256-bit opaque token
  responses:
    Accepted:
      description: Command accepted for asynchronous execution
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommandResponse"
    Unauthorized:
      description: Missing or invalid bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Info:
      type: object
      additionalProperties: false
      required:
        - api_version
        - gateway_version
        - instance_id
        - name
        - capabilities
      properties:
        api_version:
          type: integer
          const: 1
        gateway_version:
          type: string
          examples: [2.0.0-beta.1]
        instance_id:
          type: string
          format: uuid
        name:
          type: string
          const: Reolink SIP Gateway
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [call_status, caller_number, dtmf_events, events, hangup, parallel_calls, route_test_calls, test_call]
    Status:
      type: object
      additionalProperties: false
      required: [api_version, revision, updated_at, gateway, sip, call, media, controls]
      properties:
        api_version:
          type: integer
          const: 1
        revision:
          type: integer
          minimum: 1
        generated_at:
          type: string
          format: date-time
          description: Time this response or event snapshot was generated; advances independently of state revision.
        updated_at:
          type: string
          format: date-time
        gateway:
          $ref: "#/components/schemas/GatewayStatus"
        sip:
          $ref: "#/components/schemas/SIPStatus"
        call:
          $ref: "#/components/schemas/CallStatus"
        media:
          $ref: "#/components/schemas/MediaStatus"
        controls:
          $ref: "#/components/schemas/Controls"
        routes:
          type: array
          description: Configured route catalogue; present when route_test_calls is advertised
          items:
            $ref: "#/components/schemas/RouteStatus"
    DTMFEvent:
      type: object
      additionalProperties: false
      required:
        - api_version
        - digit
        - duration_ms
        - call_direction
        - remote_number
        - call_id
        - received_at
        - instance_id
      properties:
        api_version:
          type: integer
          const: 1
        digit:
          type: string
          pattern: '^[0-9*#A-D]$'
          description: Completed RFC 4733 DTMF key
        duration_ms:
          type: integer
          minimum: 0
          maximum: 8192
          description: Telephone-event duration converted from the 8 kHz RTP clock
        call_direction:
          type: string
          enum: [incoming, outgoing]
        remote_number:
          type: string
          description: Exact normalized remote party; incoming caller or configured outgoing destination
        call_id:
          type: string
          minLength: 1
          maxLength: 256
          description: SIP dialog Call-ID used to keep keypresses from separate calls isolated
        received_at:
          type: string
          format: date-time
        instance_id:
          type: string
          format: uuid
    GatewayStatus:
      type: object
      additionalProperties: false
      required: [version, state, started_at, home_assistant_connected, dry_run]
      properties:
        version:
          type: string
        state:
          type: string
          enum: [starting, preparing, idle, dialing, connecting_media, active, ending, error, stopping]
        started_at:
          type: string
          format: date-time
        home_assistant_connected:
          type: boolean
          description: True only when the Home Assistant trigger is connected
        trigger_source:
          type: string
          enum: [homeassistant, baichuan, manual]
          description: Active trigger provider; added in gateway 2.0
        trigger_connected:
          type: boolean
          description: Active trigger provider is ready; manual mode is always ready
        trigger_events:
          $ref: '#/components/schemas/TriggerDiagnostics'
        dry_run:
          type: boolean
        last_visitor_event:
          type: string
          format: date-time
        last_error:
          type: string
    TriggerDiagnostics:
      type: object
      additionalProperties: false
      description: Baichuan event counts since gateway startup; emitted counts trigger events, not completed SIP calls. Contains no raw XML or credentials.
      properties:
        stage:
          type: string
          enum: [connecting, nonce, login, subscribing, listening, keepalive, retry_wait, stopped]
        connection_attempts:
          type: integer
          minimum: 0
        successful_connections:
          type: integer
          minimum: 0
        last_attempt_at:
          type: string
          format: date-time
        last_connected_at:
          type: string
          format: date-time
        last_error:
          type: string
          maxLength: 512
        last_error_stage:
          type: string
        last_error_at:
          type: string
          format: date-time
        next_retry_at:
          type: string
          format: date-time
        messages:
          type: integer
          minimum: 0
        channel_events:
          type: integer
          minimum: 0
        visitor_states:
          type: integer
          minimum: 0
        emitted:
          type: integer
          minimum: 0
        invalid_messages:
          type: integer
          minimum: 0
        initial_active_states:
          type: integer
          minimum: 0
        last_channel:
          type: integer
          minimum: 0
          maximum: 255
          description: Last parsed zero-based channel; meaningful after channel events arrive.
        last_message_at:
          type: string
          format: date-time
    SIPStatus:
      type: object
      additionalProperties: false
      required: [registered, door_call_enabled, door_registered, parallel_call_enabled, parallel_registered]
      properties:
        registered:
          type: boolean
          description: Whether at least one enabled SIP account is registered
        last_registration_error:
          type: string
          description: Registration error of the legacy door-account status field
        door_call_enabled:
          type: boolean
          description: Whether the door-station SIP account is configured
        door_registered:
          type: boolean
          description: Registration state of the enabled door-station SIP account
        parallel_call_enabled:
          type: boolean
          description: Whether the optional second SIP account and mobile destinations are configured
        parallel_registered:
          type: boolean
          description: Registration state of the optional mobile-call SIP account
        parallel_last_registration_error:
          type: string
    CallStatus:
      type: object
      additionalProperties: false
      required: [active, state]
      properties:
        active:
          type: boolean
        state:
          type: string
          enum: [idle, dialing, connecting_media, active, ending]
        direction:
          type: string
          enum: [incoming, outgoing]
        last_direction:
          type: string
          enum: [incoming, outgoing]
        caller_number:
          type: string
          description: Canonical current incoming caller number or SIP user
        last_caller_number:
          type: string
          description: Most recently accepted incoming caller number or SIP user
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        codec:
          type: string
          enum: [pcma, pcmu]
        route_id:
          type: string
          description: Stable route ID of the current outgoing call
        route_name:
          type: string
          description: Display name of the current outgoing route
        last_route_id:
          type: string
          description: Stable route ID of the most recently started route call
        last_route_name:
          type: string
          description: Display name of the most recently started route call
    MediaStatus:
      type: object
      additionalProperties: false
      required: [configured_reolink_mode, calibrated_delay_ms, current_delay_ms]
      properties:
        camera_audio:
          $ref: "#/components/schemas/CameraAudioStatus"
        configured_reolink_mode:
          type: string
          enum: [auto, standalone, nvr, direct]
        active_reolink_mode:
          type: string
          enum: [standalone, nvr, direct]
        profile:
          type: string
        receive_mode:
          type: string
        receive_details:
          type: string
        talkback_mode:
          type: string
        talkback_details:
          type: string
        echo_cancellation:
          type: string
        calibrated_delay_ms:
          type: integer
          minimum: 0
        current_delay_ms:
          type: integer
          minimum: 0
        calibration_status:
          type: string
        calibration_details:
          type: string
          description: Failure reason or accepted acoustic correlation and peak ratio; a fallback delay is not a new measurement.
        echo_cancellation_enabled:
          type: boolean
        echo_stats:
          $ref: '#/components/schemas/EchoProcessingStatus'
        stats_call_started_at:
          type: string
          format: date-time
          description: Call that owns the retained media counters.
        stats_current_call:
          type: boolean
          description: Whether the retained counters belong to the currently active call.
        last_calibration:
          type: string
          format: date-time
    EchoProcessingStatus:
      type: object
      additionalProperties: false
      description: Native WebRTC processing counters; validity flags must be checked before interpreting ERLE or residual echo. Initialization silence is not a live measurement.
      required: [available, capture_frames, render_frames, missing_render_frames, current_delay_ms, erle_valid, erle_db, residual_echo_valid, residual_echo_likelihood]
      properties:
        available:
          type: boolean
        capture_frames:
          type: integer
          minimum: 0
        render_frames:
          type: integer
          minimum: 0
        missing_render_frames:
          type: integer
          minimum: 0
        current_delay_ms:
          type: integer
          minimum: 0
        erle_valid:
          type: boolean
        erle_db:
          type: number
          description: Echo return loss enhancement reported by WebRTC, not the gateway energy-ratio estimate.
        residual_echo_valid:
          type: boolean
        residual_echo_likelihood:
          type: number
    CameraAudioStatus:
      type: object
      additionalProperties: false
      description: Baichuan camera-to-phone counters, retained after hangup until the next media session; an unanswered SIP dial does not reset them. Sent RTP does not confirm phone playback.
      required: [available, packets, encoded_bytes, pcm_samples, pcm_peak, rtp_packets]
      properties:
        available:
          type: boolean
        packets:
          type: integer
          minimum: 0
        encoded_bytes:
          type: integer
          minimum: 0
        pcm_samples:
          type: integer
          minimum: 0
        pcm_peak:
          type: integer
          minimum: 0
          maximum: 32768
        rtp_packets:
          type: integer
          minimum: 0
    Controls:
      type: object
      additionalProperties: false
      required: [test_call_available, hangup_available]
      properties:
        test_call_available:
          type: boolean
        hangup_available:
          type: boolean
    RouteStatus:
      type: object
      additionalProperties: false
      required: [id, name, test_call_available]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 64
        test_call_available:
          type: boolean
          description: Whether at least one SIP account used by this route is registered and the global call slot is free
    CommandResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: accepted
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - forbidden
                - not_found
                - method_not_allowed
                - call_busy
                - route_not_found
                - sip_unavailable
                - gateway_unavailable
                - streaming_unavailable
                - internal_error
            message:
              type: string

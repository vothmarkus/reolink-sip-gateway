configuration:
  reolink:
    name: Reolink
    description: Connection to the doorbell or NVR and selection of the Reolink media path.
    fields:
      reolink_host:
        name: Reolink address
        description: IP address or DNS name of the directly reachable doorbell or NVR.
      reolink_username:
        name: Reolink username
        description: Camera or NVR user with live-view and talk permissions; the default is “admin”.
      reolink_password:
        name: Reolink password
        description: Password of the Reolink/NVR user.
      reolink_mode:
        name: Reolink mode
        description: '"auto" detects one complete audio profile at startup. "standalone" uses RTSP in both directions for a directly reachable doorbell; "nvr" uses Baichuan in both directions through the NVR.'
      nvr_channel_number:
        name: NVR channel
        description: Doorbell channel number as shown in the Reolink NVR interface (starting at 1). Only relevant when an NVR is used; this value is ignored in standalone mode.
      reolink_rtsp_port:
        name: RTSP port (advanced)
        description: RTSP port of the doorbell or NVR, usually 554.
      baichuan_port:
        name: Baichuan port (advanced)
        description: TCP port of Reolink Basic Service used in NVR mode, usually 9000.
  sip:
    name: SIP telephony
    description: Independently enabled door-station and mobile-call accounts on the same PBX.
    fields:
      sip_registrar:
        name: SIP registrar
        description: “auto” uses the IPv4 default-gateway address of the Home Assistant host (often the FRITZ!Box). Alternatively, enter the SIP registrar IP address or DNS name manually.
      door_call_enabled:
        name: Enable door-station account
        description: Registers the first account as an IP door intercom. When disabled, the gateway can operate with only the mobile-call account and its one to three destinations.
      sip_username:
        name: Door-station account username
        description: Username of the device configured as an IP door intercom in the FRITZ!Box. Required only when the door-station account is enabled.
      sip_password:
        name: Door-station account password
        description: Password of the IP door intercom configured in the FRITZ!Box. Required only when the door-station account is enabled.
      sip_display_name:
        name: Door-station display name
        description: Caller name shown on the SIP endpoint for a door-station call.
      sip_codec_preference:
        name: Preferred audio codec
        description: PCMA is recommended for European telephony; auto offers PCMA and PCMU.
      parallel_call_enabled:
        name: Enable mobile-call account
        description: Registers a normal IP phone on the same FRITZ!Box and calls up to three mobile destinations simultaneously, alongside an enabled door station or as the only route. The first answered call wins.
      parallel_username:
        name: Mobile-call account username
        description: Username of the FRITZ!Box device configured as a normal IP phone. Required only when the mobile-call account is enabled.
      parallel_password:
        name: Mobile-call account password
        description: Password of the mobile-call IP phone. Required only when the mobile-call account is enabled.
      sip_registrar_port:
        name: SIP port (advanced)
        description: UDP port of the SIP registrar, usually 5060.
      sip_local_port:
        name: Door-account local SIP port (advanced)
        description: UDP port used by the door-station account for SIP signalling. RTP ports are selected automatically.
      parallel_local_port:
        name: Mobile-call local SIP port (advanced)
        description: UDP port for the mobile-call account; defaults to 5071 and must differ from the door-station port when both accounts are enabled.
  audio:
    name: Audio
    description: Echo cancellation and WebRTC audio filters. Reolink latency is calibrated automatically at startup.
    fields:
      echo_cancellation_enabled:
        name: WebRTC echo cancellation
        description: Enables native WebRTC AEC. Acoustic Reolink latency is measured at startup and kept as a fixed coarse delay for the whole call.
      webrtc_high_pass_filter_enabled:
        name: WebRTC high-pass filter
        description: Removes low-frequency rumble and wind components from the doorbell microphone signal.
      webrtc_noise_suppression_enabled:
        name: WebRTC noise suppression
        description: Enables WebRTC noise suppression using the fixed, proven moderate profile.
  call:
    name: Call
    description: Incoming SIP calls and call time limits. The associated doorbell triggers and dial destinations are listed directly below under Call routes / doorbell buttons.
    fields:
      incoming_calls_enabled:
        name: Allow incoming SIP calls on all accounts
        description: Applies to every enabled SIP account. The first incoming call receives the exclusive Reolink media path; later calls receive 486 Busy Here. Only calls from the registrar and caller list are accepted. RFC 4733 DTMF is negotiated on both accounts.
      incoming_allowed_callers:
        name: Allowed callers
        description: List of permitted telephone numbers or internal SIP usernames. Spaces, hyphens, periods, slashes and parentheses in telephone numbers are ignored when matching. “*” allows every caller and must be the only entry; country codes are not converted automatically.
      incoming_connection_tone_enabled:
        name: Acoustic connection indication
        description: Plays a short 256 ms excerpt of the proven acoustic calibration marker at the doorbell before answering a phone-to-camera call.
      debounce_seconds:
        name: Doorbell debounce
        description: Additional events from the same route within this interval are ignored. Other routes are debounced independently, but cannot displace or queue behind an active global call.
      ring_timeout_seconds:
        name: Ring timeout
        description: Time before an unanswered call is cancelled.
      rtp_inactivity_timeout_seconds:
        name: RTP connection watchdog
        description: Ends a call when no valid RTP audio packet has been received from the peer for this interval. Normal conversation pauses do not trigger it while RTP transmission continues.
      max_call_duration_seconds:
        name: Maximum call duration
        description: Safety limit for one call.
  call_routes:
    name: Call routes / doorbell buttons
    description: Each route connects one visitor sensor to an optional FRITZ!Box doorbell number (for example 11) and up to three directly entered mobile numbers. “auto” for the visitor sensor selects the enabled Reolink doorbell entity automatically. The prefilled default route is fully editable. Home Assistant's schema-depth limit requires this list to appear directly below the Call group instead of inside its collapsible panel.
    fields:
      id:
        name: Route ID
        description: Stable technical identifier such as “default” or “ground_floor”. It starts with a lowercase letter and contains only lowercase letters, digits and underscores. Do not change it after setup so the test-call entity remains stable.
      name:
        name: Display name
        description: Human-readable route name such as “Ground floor”. It is also used by the corresponding test-call entity.
      visitor_entity:
        name: Doorbell entity
        description: Home Assistant binary sensor that triggers this route. “auto” discovers the single enabled Reolink visitor entity and may be used by only one route.
      doorbell_number:
        name: FRITZ!Box doorbell button
        description: Destination assigned by the FRITZ!Box IP door-intercom setup; for example 11 for button 1. Leave empty for a mobile-only route.
      mobile_number_1:
        name: Mobile number 1
        description: First number called directly through the mobile-call account. Leave empty for no mobile call.
      mobile_number_2:
        name: Mobile number 2
        description: Optional second number called simultaneously through the same mobile-call account.
      mobile_number_3:
        name: Mobile number 3
        description: Optional third number called simultaneously through the same mobile-call account.
  live_image:
    name: FRITZ!Fon live images
    description: Local protected JPEG server for the doorbell and automatically detected NVR camera channels.
    fields:
      fritzfon_live_image_enabled:
        name: Provide live images for FRITZ!Fon
        description: Provides secret, stable .jpg addresses on port 18099. The app status page shows the existing door link and automatically refreshed NVR cameras with a channel-independent link, diagnostics, and copy button. The gateway adapts oversized images for the FRITZ!Fon and never gives camera credentials or UIDs to the FRITZ!Box.
  diagnostics:
    name: Operation & diagnostics
    description: Operating mode and logging.
    fields:
      dry_run:
        name: Passive mode
        description: Monitors visitor events without registering SIP, placing calls, or sending the audible startup calibration marker.
      log_level:
        name: Log level
        description: '"info" shows normal operation. "debug" additionally enables SIP, RTSP, Baichuan, AEC, RTP and buffer diagnostics.'

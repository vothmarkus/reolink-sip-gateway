configuration:
  reolink:
    name: Reolink
    description: Verbindung zur Doorbell bzw. zum NVR und Auswahl des Reolink-Medienwegs.
    fields:
      reolink_host:
        name: Reolink-Adresse
        description: IP-Adresse oder DNS-Name der direkt erreichbaren Doorbell oder des NVR.
      reolink_username:
        name: Reolink-Benutzername
        description: Benutzer auf Kamera oder NVR mit Livebild- und Gegensprechberechtigung; Standard ist „admin“.
      reolink_password:
        name: Reolink-Passwort
        description: Passwort des Reolink-/NVR-Benutzers.
      reolink_mode:
        name: Reolink-Modus
        description: „auto“ erkennt beim Start das passende vollständige Audioprofil. „standalone“ nutzt RTSP für Hin- und Rückkanal einer direkt erreichbaren Doorbell; „nvr“ nutzt Baichuan für Hin- und Rückkanal über den NVR.
      nvr_channel_number:
        name: NVR-Kanal
        description: Nummer des Doorbell-Kanals am Reolink-NVR, so wie sie in der NVR-Oberfläche angezeigt wird (beginnend bei 1). Nur relevant, wenn ein NVR verwendet wird; im Standalone-Modus wird dieser Wert ignoriert.
      reolink_rtsp_port:
        name: RTSP-Port (erweitert)
        description: RTSP-Port der Doorbell oder des NVR; normalerweise 554.
      baichuan_port:
        name: Baichuan-Port (erweitert)
        description: TCP-Port des Reolink Basic Service für den NVR-Modus; normalerweise 9000.
  sip:
    name: SIP-Telefonie
    description: Unabhängig aktivierbares Türsprechstellen- und Mobilruf-Konto an derselben Telefonanlage.
    fields:
      sip_registrar:
        name: SIP-Registrar
        description: „auto“ verwendet die IPv4-Gateway-Adresse des Home-Assistant-Hosts (häufig die FRITZ!Box). Alternativ kann die IP-Adresse oder der DNS-Name des SIP-Registrars manuell eingetragen werden.
      door_call_enabled:
        name: Türsprechstellen-Konto aktivieren
        description: Registriert das erste Konto als IP-Türsprechanlage. Bei Deaktivierung kann das Gateway ausschließlich das Mobilruf-Konto und dessen bis zu drei Ziele verwenden.
      sip_username:
        name: Benutzername des Türsprechstellen-Kontos
        description: Benutzername des in der FRITZ!Box als IP-Türsprechanlage angelegten Geräts. Nur bei aktiviertem Türsprechstellen-Konto erforderlich.
      sip_password:
        name: Passwort des Türsprechstellen-Kontos
        description: Kennwort der in der FRITZ!Box angelegten IP-Türsprechanlage. Nur bei aktiviertem Türsprechstellen-Konto erforderlich.
      sip_destination:
        name: FRITZ!Box-Türziel / Klingeltaster
        description: Rufziel für den einfachen Modus ohne Anrufrouten. Beispielsweise steht 11 typischerweise für Klingeltaster 1 in der FRITZ!Box. Bei konfigurierten Anrufrouten wird stattdessen deren Feld „doorbell_number“ verwendet.
      sip_display_name:
        name: Anzeigename der Türsprechstelle
        description: Name, der beim Türsprechstellen-Ruf auf dem SIP-Endgerät erscheinen soll.
      sip_codec_preference:
        name: Bevorzugter Audiocodec
        description: PCMA wird für deutsche Telefonanlagen empfohlen; „auto“ bietet PCMA und PCMU an.
      sip_registrar_port:
        name: SIP-Port (erweitert)
        description: UDP-Port des SIP-Registrars; normalerweise 5060.
      sip_local_port:
        name: Lokaler SIP-Port des Tür-Kontos (erweitert)
        description: UDP-Port des Türsprechstellen-Kontos für die SIP-Signalisierung. RTP-Ports werden automatisch gewählt.
      parallel_call_enabled:
        name: Mobilruf-Konto aktivieren
        description: Registriert ein normales IP-Telefon an derselben FRITZ!Box und ruft bis zu drei Mobilziele gleichzeitig an – parallel zur aktiven Türsprechstelle oder als alleiniger Rufweg. Der zuerst angenommene Ruf gewinnt.
      parallel_username:
        name: Benutzername des Mobilruf-Kontos
        description: Benutzername des als normales IP-Telefon eingerichteten FRITZ!Box-Kontos. Nur bei aktiviertem Mobilruf-Konto erforderlich.
      parallel_password:
        name: Passwort des Mobilruf-Kontos
        description: Kennwort des Mobilruf-IP-Telefons. Nur bei aktiviertem Mobilruf-Konto erforderlich.
      parallel_destinations:
        name: Mobilruf-Ziele
        description: Eine bis maximal drei gleichzeitig anzurufende externe Rufnummern im einfachen Modus ohne Anrufrouten. Im Routenmodus werden benannte Mobilziele und deren IDs verwendet.
      parallel_local_port:
        name: Lokaler SIP-Port des Mobilruf-Kontos (erweitert)
        description: UDP-Port des Mobilruf-Kontos; standardmäßig 5071 und bei gleichzeitig aktivem Tür-Konto verschieden von dessen Port.
  mobile_targets:
    name: Benannte Mobilziele (Routenmodus)
    description: Optionaler gemeinsamer Rufnummernkatalog für mehrere Klingeltaster. Jeder Eintrag erhält eine kurze ID (z. B. „markus“), einen Anzeigenamen und die zu wählende Rufnummer. Die Rufnummer muss dadurch nur einmal gepflegt werden. Die Liste wird erst zusammen mit „Anrufrouten“ aktiv.
  call_routes:
    name: Anrufrouten / Klingeltaster (Routenmodus)
    description: Optional. Jeder Eintrag verbindet eine eindeutige Routen-ID und einen Anzeigenamen mit genau einem binary_sensor, optional einer FRITZ!Box-Klingeltaster-Nummer (z. B. 11) und bis zu drei IDs aus „Benannte Mobilziele“. Nicht verwendete Felder mobile_target_1 bis mobile_target_3 bleiben leer. Sobald mindestens eine Route vorhanden ist, ersetzt diese Liste die einfachen Felder Besucher-Sensor, Türziel und Mobilruf-Ziele.
  audio:
    name: Audio
    description: Echounterdrückung und WebRTC-Audiofilter. Die Reolink-Latenz wird beim Start automatisch kalibriert.
    fields:
      echo_cancellation_enabled:
        name: WebRTC-Echounterdrückung
        description: Aktiviert die native WebRTC-AEC. Beim Start wird die akustische Reolink-Latenz automatisch gemessen und als fester Coarse-Delay für den gesamten Anruf verwendet.
      webrtc_high_pass_filter_enabled:
        name: WebRTC-Hochpassfilter
        description: Entfernt tieffrequentes Rumpeln und Windanteile aus dem Doorbell-Mikrofonsignal.
      webrtc_noise_suppression_enabled:
        name: WebRTC-Rauschunterdrückung
        description: Aktiviert die WebRTC-Rauschunterdrückung mit festem, bewährtem Profil „moderate“.
  call:
    name: Anruf
    description: Klingelauslöser, eingehende SIP-Anrufe und zeitliche Begrenzungen.
    fields:
      visitor_entity:
        name: Reolink-Besucher-Sensor
        description: Auslöser für den einfachen Modus ohne Anrufrouten. „auto“ verwendet automatisch den aktivierten Besucher-/Klingelsensor der Reolink-Integration. Im Routenmodus trägt jede Route ihren eigenen binary_sensor ein; weiterhin wird genau eine Reolink-Kamera verwendet.
      incoming_calls_enabled:
        name: Eingehende SIP-Anrufe auf allen Konten zulassen
        description: Gilt für jedes aktivierte SIP-Konto. Der erste eingehende Anruf erhält den exklusiven Reolink-Medienweg; weitere Anrufe werden mit 486 Busy Here abgewiesen. Es werden nur Anrufe vom Registrar und aus der Anruferliste akzeptiert. RFC-4733-DTMF wird auf beiden Konten ausgehandelt.
      incoming_allowed_callers:
        name: Erlaubte Anrufer
        description: Liste zulässiger Rufnummern oder interner SIP-Benutzernamen. Leerzeichen, Bindestriche, Punkte, Schrägstriche und Klammern in Telefonnummern werden beim Vergleich ignoriert. „*“ erlaubt alle Anrufer und muss allein stehen; Landesvorwahlen werden nicht automatisch umgerechnet.
      incoming_connection_tone_enabled:
        name: Akustischer Hinweiston
        description: Spielt vor der Annahme eines Telefon-zu-Kamera-Anrufs einen kurzen 256-ms-Ausschnitt des bewährten akustischen Kalibrierungsmarkers an der Doorbell ab.
      debounce_seconds:
        name: Klingelentprellung
        description: Weitere Klingelereignisse derselben Route innerhalb dieser Zeit werden ignoriert. Andere Routen werden unabhängig entprellt, können aber keinen bereits aktiven globalen Anruf verdrängen oder in eine Warteschlange stellen.
      ring_timeout_seconds:
        name: Klingeldauer
        description: Zeit bis zum Abbruch eines nicht angenommenen Anrufs.
      rtp_inactivity_timeout_seconds:
        name: RTP-Verbindungswächter
        description: Beendet ein Gespräch, wenn so lange kein gültiges RTP-Audiopaket der Gegenstelle empfangen wurde. Normale Gesprächspausen lösen den Wächter nicht aus, solange weiterhin RTP übertragen wird.
      max_call_duration_seconds:
        name: Maximale Gesprächsdauer
        description: Sicherheitsbegrenzung für ein Gespräch.
  diagnostics:
    name: Betrieb & Diagnose
    description: Betriebsmodus und Protokollierung.
    fields:
      dry_run:
        name: Passivmodus
        description: Überwacht Klingelereignisse, ohne SIP zu registrieren, Anrufe zu starten oder den akustischen Kalibrierungsmarker auszugeben.
      log_level:
        name: Protokollstufe
        description: „info“ zeigt den normalen Betrieb. „debug“ aktiviert zusätzlich SIP-, RTSP-, Baichuan-, AEC-, RTP- und Pufferdiagnosen.

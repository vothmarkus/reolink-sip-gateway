name: Reolink SIP Gateway
version: "0.5.14"
slug: reolink_sip_gateway
description: Ruft bei einem Reolink-Klingelereignis ein SIP-Ziel an und überträgt Zwei-Wege-Audio.
url: https://github.com/vothmarkus/reolink-sip-gateway
arch:
  - amd64
stage: stable
startup: application
boot: auto
init: false
homeassistant_api: true
host_network: true
ingress: true
ingress_port: 18099
panel_icon: mdi:doorbell-video
panel_title: Reolink SIP Gateway
watchdog: http://[HOST]:[PORT:18099]/health
backup: cold
options:
  reolink:
    reolink_host: 192.168.177.50
    reolink_username: admin
    reolink_password: ""
    reolink_mode: auto
    nvr_channel_number: 1
    reolink_rtsp_port: 554
    baichuan_port: 9000
  sip:
    sip_registrar: auto
    sip_username: ""
    sip_password: ""
    sip_destination: "**610"
    sip_display_name: Haustür
    sip_codec_preference: pcma
    sip_registrar_port: 5060
    sip_local_port: 5070
  audio:
    echo_cancellation_enabled: true
    webrtc_high_pass_filter_enabled: true
    webrtc_noise_suppression_enabled: true
  call:
    visitor_entity: auto
    debounce_seconds: 3
    ring_timeout_seconds: 30
    max_call_duration_seconds: 300
  diagnostics:
    dry_run: true
    log_level: info
schema:
  reolink:
    reolink_host: str
    reolink_username: str
    reolink_password: password
    reolink_mode: list(auto|standalone|nvr)
    nvr_channel_number: int(1,256)
    reolink_rtsp_port: port
    baichuan_port: port
  sip:
    sip_registrar: str
    sip_username: str
    sip_password: password
    sip_destination: str
    sip_display_name: str
    sip_codec_preference: list(auto|pcma|pcmu)
    sip_registrar_port: port
    sip_local_port: port
  audio:
    echo_cancellation_enabled: bool
    webrtc_high_pass_filter_enabled: bool
    webrtc_noise_suppression_enabled: bool
  call:
    visitor_entity: "match(^(auto|binary_sensor\\.[a-z0-9_]+)$)"
    debounce_seconds: int(0,60)
    ring_timeout_seconds: int(5,180)
    max_call_duration_seconds: int(15,3600)
  diagnostics:
    dry_run: bool
    log_level: list(debug|info|warn|error)
